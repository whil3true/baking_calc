name: Apply BakeCalc calculation fixes

on:
  push:
    branches: [fix/calculation-cost-weight]

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, 'Fix BakeCalc cost and weight calculations')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch index.html
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          # Replace the broken package-unit conversion with an explicit
          # package -> ingredient conversion. Incompatible dimensions return null.
          new_conversion = r'''function convertPackageToIngredientUnit(value, packageUnit, ingredientUnit) {
            if (packageUnit === ingredientUnit) return value;

            // Масса: упаковка -> единица ингредиента.
            if (packageUnit === 'кг' && ingredientUnit === 'г') return value * 1000;
            if (packageUnit === 'г' && ingredientUnit === 'кг') return value / 1000;

            // Объем: упаковка -> единица ингредиента.
            if (packageUnit === 'л' && ingredientUnit === 'мл') return value * 1000;
            if (packageUnit === 'мл' && ingredientUnit === 'л') return value / 1000;

            // Нельзя автоматически переводить массу, объем и штуки друг в друга.
            return null;
          }'''

          pattern = r'function convertToBaseUnit\(value, unit, packageUnit\) \{.*?\n\}'
          text, n = re.subn(pattern, new_conversion, text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Не найден блок convertToBaseUnit')

          new_cost = r'''function calculateIngredientsCost() {
            if (!state.result) return 0;
            const k = state.result.coefficient;
            let total = 0;

            state.ingredients.forEach(ing => {
              const newAmount = validateNumber(ing.amount, 0) * k;
              const packageAmount = validateNumber(ing.packageWeight, 0);
              const packageUnit = ing.packageUnit || ing.unit || 'г';
              const ingredientUnit = ing.unit || 'г';
              const price = validateNumber(ing.price, 0);

              if (newAmount <= 0 || packageAmount <= 0 || price <= 0) return;

              // Example: 1 kg for 80 ₽ -> 1000 g for 80 ₽ -> 0.08 ₽/g.
              const packageInIngredientUnits = convertPackageToIngredientUnit(
                packageAmount,
                packageUnit,
                ingredientUnit
              );

              // Do not silently treat g/ml/pcs as interchangeable.
              if (packageInIngredientUnits === null || packageInIngredientUnits <= 0) return;

              total += (price / packageInIngredientUnits) * newAmount;
            });

            return total;
          }'''

          pattern = r'function calculateIngredientsCost\(\) \{.*?\n\}'
          text, n = re.subn(pattern, new_cost, text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Не найден блок calculateIngredientsCost')

          new_weight = r'''function calculateTotalWeight() {
            if (!state.result) return 0;
            const k = state.result.coefficient;
            let totalGrams = 0;

            state.ingredients.forEach(ing => {
              // Without ingredient density/mass-per-piece data, only grams
              // can be safely included in a gram total.
              if ((ing.unit || 'г') === 'г') {
                totalGrams += validateNumber(ing.amount, 0) * k;
              }
            });

            return state.result.roundResults
              ? Math.round(totalGrams)
              : Number(totalGrams.toFixed(1));
          }'''

          pattern = r'function calculateTotalWeight\(\) \{.*?\n\}'
          text, n = re.subn(pattern, new_weight, text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Не найден блок calculateTotalWeight')

          # Restore persisted numeric values when rows are rendered.
          replacements = [
              ('value="" placeholder="0"\n        oninput="onIngredientInput(${ing.id}, \'amount\'', 'value="${ing.amount}" placeholder="0"\n        oninput="onIngredientInput(${ing.id}, \'amount\''),
              ('value="" placeholder="0.00"\n        oninput="onIngredientInput(${ing.id}, \'price\'', 'value="${ing.price}" placeholder="0.00"\n        oninput="onIngredientInput(${ing.id}, \'price\''),
              ('value="" placeholder="0"\n        oninput="onIngredientInput(${ing.id}, \'packageWeight\'', 'value="${ing.packageWeight}" placeholder="0"\n        oninput="onIngredientInput(${ing.id}, \'packageWeight\''),
              ('value="" placeholder="0.00"\n      oninput="onExtraCostInput(${cost.id}, \'amount\'', 'value="${cost.amount}" placeholder="0.00"\n      oninput="onExtraCostInput(${cost.id}, \'amount\''),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Не найден шаблон сохраненного значения: {old[:70]}')
              text = text.replace(old, new, 1)

          # Make the result label explicit: this is a safe gram total, not a
          # fake sum of grams + milliliters + pieces.
          old_label = '<div class="text-xs text-dark/50 mb-1">Общий вес</div>'
          new_label = '<div class="text-xs text-dark/50 mb-1">Вес ингредиентов (г)</div>'
          if old_label not in text:
              raise SystemExit('Не найден label общего веса')
          text = text.replace(old_label, new_label, 1)

          old_copy = 'text += `⚖️ Общий вес: ${calculateTotalWeight()} г\\n`;'
          new_copy = 'text += `⚖️ Вес ингредиентов (г): ${calculateTotalWeight()} г\\n`;'
          if old_copy not in text:
              raise SystemExit('Не найдена строка веса при копировании')
          text = text.replace(old_copy, new_copy, 1)

          # Basic source-level assertions. These intentionally fail the workflow
          # instead of committing a half-applied patch.
          required = [
              'function convertPackageToIngredientUnit',
              'function calculateIngredientsCost()',
              'function calculateTotalWeight()',
              'value="${ing.amount}"',
              'value="${ing.price}"',
              'value="${ing.packageWeight}"',
              'value="${cost.amount}"'
          ]
          for marker in required:
              if marker not in text:
                  raise SystemExit(f'Проверка не пройдена: {marker}')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Run calculation tests
        run: |
          node <<'JS'
          const assert = require('node:assert/strict');

          function convertPackageToIngredientUnit(value, packageUnit, ingredientUnit) {
            if (packageUnit === ingredientUnit) return value;
            if (packageUnit === 'кг' && ingredientUnit === 'г') return value * 1000;
            if (packageUnit === 'г' && ingredientUnit === 'кг') return value / 1000;
            if (packageUnit === 'л' && ingredientUnit === 'мл') return value * 1000;
            if (packageUnit === 'мл' && ingredientUnit === 'л') return value / 1000;
            return null;
          }

          function ingredientCost(amount, unit, price, packageAmount, packageUnit, coefficient = 1) {
            const packageInIngredientUnits = convertPackageToIngredientUnit(packageAmount, packageUnit, unit);
            if (packageInIngredientUnits === null || packageInIngredientUnits <= 0 || price <= 0) return 0;
            return (price / packageInIngredientUnits) * amount * coefficient;
          }

          assert.equal(ingredientCost(150, 'г', 80, 1, 'кг'), 12);
          assert.equal(ingredientCost(30, 'г', 220, 200, 'г'), 33);
          assert.equal(ingredientCost(50, 'мл', 85, 1, 'л'), 4.25);
          assert.equal(ingredientCost(4, 'шт', 120, 10, 'шт'), 48);
          assert.equal(ingredientCost(100, 'г', 100, 1, 'л'), 0);
          assert.equal(ingredientCost(2, 'г', 100, 500, 'г', 2), 0.4);

          console.log('BakeCalc calculation tests passed.');
          JS

      - name: Commit fix and remove temporary workflow
        run: |
          rm -f .github/workflows/apply-calculation-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/apply-calculation-fix.yml
          git diff --cached --quiet && exit 0
          git commit -m "Fix BakeCalc cost and weight calculations"
          git push
