name: Finalize BakeCalc calculation fix

on:
  push:
    branches: [fix/calculation-cost-weight]

permissions:
  contents: write

jobs:
  finalize:
    if: "github.event.head_commit.message == 'Correct calculation test expectation'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply fixes, test, and clean up
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          conversion = '''function convertPackageToIngredientUnit(value, packageUnit, ingredientUnit) {
            if (packageUnit === ingredientUnit) return value;
            if (packageUnit === 'кг' && ingredientUnit === 'г') return value * 1000;
            if (packageUnit === 'г' && ingredientUnit === 'кг') return value / 1000;
            if (packageUnit === 'л' && ingredientUnit === 'мл') return value * 1000;
            if (packageUnit === 'мл' && ingredientUnit === 'л') return value / 1000;
            return null;
          }'''
          text, n = re.subn(r'function convertToBaseUnit\(value, unit, packageUnit\) \{.*?\n\}', conversion, text, count=1, flags=re.S)
          if n != 1: raise SystemExit('conversion block not found')

          cost = '''function calculateIngredientsCost() {
            if (!state.result) return 0;
            const k = state.result.coefficient;
            let total = 0;

            state.ingredients.forEach(ing => {
              const newAmount = validateNumber(ing.amount, 0) * k;
              const packageAmount = validateNumber(ing.packageWeight, 0);
              const packageUnit = ing.packageUnit || ing.unit || 'г';
              const ingredientUnit = ing.unit || 'г';
              const price = validateNumber(ing.price, 0);

              if (newAmount <= 0 || packageAmount <= 0 || price <= 0) return;

              const packageInIngredientUnits = convertPackageToIngredientUnit(
                packageAmount,
                packageUnit,
                ingredientUnit
              );

              if (packageInIngredientUnits === null || packageInIngredientUnits <= 0) return;
              total += (price / packageInIngredientUnits) * newAmount;
            });

            return total;
          }'''
          text, n = re.subn(r'function calculateIngredientsCost\(\) \{.*?\n\}', cost, text, count=1, flags=re.S)
          if n != 1: raise SystemExit('cost block not found')

          weight = '''function calculateTotalWeight() {
            if (!state.result) return 0;
            const k = state.result.coefficient;
            let totalGrams = 0;

            state.ingredients.forEach(ing => {
              if ((ing.unit || 'г') === 'г') {
                totalGrams += validateNumber(ing.amount, 0) * k;
              }
            });

            return state.result.roundResults
              ? Math.round(totalGrams)
              : Number(totalGrams.toFixed(1));
          }'''
          text, n = re.subn(r'function calculateTotalWeight\(\) \{.*?\n\}', weight, text, count=1, flags=re.S)
          if n != 1: raise SystemExit('weight block not found')

          pairs = [
            ('value="" placeholder="0"\n        oninput="onIngredientInput(${ing.id}, \'amount\'', 'value="${ing.amount}" placeholder="0"\n        oninput="onIngredientInput(${ing.id}, \'amount\''),
            ('value="" placeholder="0.00"\n        oninput="onIngredientInput(${ing.id}, \'price\'', 'value="${ing.price}" placeholder="0.00"\n        oninput="onIngredientInput(${ing.id}, \'price\''),
            ('value="" placeholder="0"\n        oninput="onIngredientInput(${ing.id}, \'packageWeight\'', 'value="${ing.packageWeight}" placeholder="0"\n        oninput="onIngredientInput(${ing.id}, \'packageWeight\''),
            ('value="" placeholder="0.00"\n      oninput="onExtraCostInput(${cost.id}, \'amount\'', 'value="${cost.amount}" placeholder="0.00"\n      oninput="onExtraCostInput(${cost.id}, \'amount\''),
          ]
          for old, new in pairs:
            if old not in text: raise SystemExit('persisted input pattern not found')
            text = text.replace(old, new, 1)

          label = '<div class="text-xs text-dark/50 mb-1">Общий вес</div>'
          if label not in text: raise SystemExit('weight label not found')
          text = text.replace(label, '<div class="text-xs text-dark/50 mb-1">Вес ингредиентов (г)</div>', 1)

          copy_line = 'text += `⚖️ Общий вес: ${calculateTotalWeight()} г\\n`;'
          if copy_line not in text: raise SystemExit('copy weight line not found')
          text = text.replace(copy_line, 'text += `⚖️ Вес ингредиентов (г): ${calculateTotalWeight()} г\\n`;', 1)

          path.write_text(text, encoding='utf-8')
          PY

          node <<'JS'
          const assert = require('node:assert/strict');
          const convert = (value, from, to) => {
            if (from === to) return value;
            if (from === 'кг' && to === 'г') return value * 1000;
            if (from === 'г' && to === 'кг') return value / 1000;
            if (from === 'л' && to === 'мл') return value * 1000;
            if (from === 'мл' && to === 'л') return value / 1000;
            return null;
          };
          const cost = (amount, unit, price, packageAmount, packageUnit, k = 1) => {
            const p = convert(packageAmount, packageUnit, unit);
            if (p === null || p <= 0 || price <= 0) return 0;
            return price / p * amount * k;
          };
          assert.equal(cost(150, 'г', 80, 1, 'кг'), 12);
          assert.equal(cost(30, 'г', 220, 200, 'г'), 33);
          assert.equal(cost(50, 'мл', 85, 1, 'л'), 4.25);
          assert.equal(cost(4, 'шт', 120, 10, 'шт'), 48);
          assert.equal(cost(100, 'г', 100, 1, 'л'), 0);
          assert.equal(cost(2, 'г', 100, 500, 'г', 2), 0.8);
          console.log('BakeCalc calculation tests passed.');
          JS

          rm -f .github/workflows/apply-calculation-fix.yml .github/workflows/correct-calculation-test.yml .github/workflows/finalize-calculation-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows
          git commit -m "Fix BakeCalc cost and weight calculations"
          git push
