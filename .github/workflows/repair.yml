name: Repair BakeCalc
on: push
permissions:
  contents: write
jobs:
  repair:
    if: "!contains(github.event.head_commit.message, 'Fix BakeCalc cost and weight calculations')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          s,n=re.subn(r'function convertToBaseUnit\(value, unit, packageUnit\) \{.*?\n\}', '''function convertPackageToIngredientUnit(value, packageUnit, ingredientUnit) {
            if (packageUnit === ingredientUnit) return value;
            if (packageUnit === 'кг' && ingredientUnit === 'г') return value * 1000;
            if (packageUnit === 'г' && ingredientUnit === 'кг') return value / 1000;
            if (packageUnit === 'л' && ingredientUnit === 'мл') return value * 1000;
            if (packageUnit === 'мл' && ingredientUnit === 'л') return value / 1000;
            return null;
          }''',s,1,re.S)
          if n!=1: raise SystemExit('conversion not found')
          s,n=re.subn(r'function calculateIngredientsCost\(\) \{.*?\n\}', '''function calculateIngredientsCost() {
            if (!state.result) return 0;
            const k = state.result.coefficient;
            let total = 0;
            state.ingredients.forEach(ing => {
              const amount = validateNumber(ing.amount, 0) * k;
              const packageAmount = validateNumber(ing.packageWeight, 0);
              const packageUnit = ing.packageUnit || ing.unit || 'г';
              const ingredientUnit = ing.unit || 'г';
              const price = validateNumber(ing.price, 0);
              if (amount <= 0 || packageAmount <= 0 || price <= 0) return;
              const packageInIngredientUnits = convertPackageToIngredientUnit(packageAmount, packageUnit, ingredientUnit);
              if (packageInIngredientUnits === null || packageInIngredientUnits <= 0) return;
              total += (price / packageInIngredientUnits) * amount;
            });
            return total;
          }''',s,1,re.S)
          if n!=1: raise SystemExit('cost not found')
          s,n=re.subn(r'function calculateTotalWeight\(\) \{.*?\n\}', '''function calculateTotalWeight() {
            if (!state.result) return 0;
            const k = state.result.coefficient;
            let totalGrams = 0;
            state.ingredients.forEach(ing => {
              if ((ing.unit || 'г') === 'г') totalGrams += validateNumber(ing.amount, 0) * k;
            });
            return state.result.roundResults ? Math.round(totalGrams) : Number(totalGrams.toFixed(1));
          }''',s,1,re.S)
          if n!=1: raise SystemExit('weight not found')
          s=s.replace('value="" placeholder="0"\n        oninput="onIngredientInput(${ing.id}, \'amount\'', 'value="${ing.amount}" placeholder="0"\n        oninput="onIngredientInput(${ing.id}, \'amount\'',1)
          s=s.replace('value="" placeholder="0.00"\n        oninput="onIngredientInput(${ing.id}, \'price\'', 'value="${ing.price}" placeholder="0.00"\n        oninput="onIngredientInput(${ing.id}, \'price\'',1)
          s=s.replace('value="" placeholder="0"\n        oninput="onIngredientInput(${ing.id}, \'packageWeight\'', 'value="${ing.packageWeight}" placeholder="0"\n        oninput="onIngredientInput(${ing.id}, \'packageWeight\'',1)
          s=s.replace('value="" placeholder="0.00"\n      oninput="onExtraCostInput(${cost.id}, \'amount\'', 'value="${cost.amount}" placeholder="0.00"\n      oninput="onExtraCostInput(${cost.id}, \'amount\'',1)
          s=s.replace('<div class="text-xs text-dark/50 mb-1">Общий вес</div>','<div class="text-xs text-dark/50 mb-1">Вес ингредиентов (г)</div>',1)
          s=s.replace('text += `⚖️ Общий вес: ${calculateTotalWeight()} г\\n`;','text += `⚖️ Вес ингредиентов (г): ${calculateTotalWeight()} г\\n`;',1)
          p.write_text(s,encoding='utf-8')
          PY
          node -e "const a=require('assert/strict'); const c=(v,f,t)=>f===t?v:(f==='кг'&&t==='г'?v*1000:f==='г'&&t==='кг'?v/1000:f==='л'&&t==='мл'?v*1000:f==='мл'&&t==='л'?v/1000:null); const x=(q,u,p,v,w,k=1)=>{let z=c(v,w,u);return z===null||z<=0||p<=0?0:p/z*q*k}; a.equal(x(150,'г',80,1,'кг'),12); a.equal(x(30,'г',220,200,'г'),33); a.equal(x(50,'мл',85,1,'л'),4.25); a.equal(x(4,'шт',120,10,'шт'),48); a.equal(x(100,'г',100,1,'л'),0); console.log('tests passed')"
          rm -f .github/workflows/apply-calculation-fix.yml .github/workflows/correct-calculation-test.yml .github/workflows/finalize-calculation-fix.yml .github/workflows/force-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows
          git commit -m "Fix BakeCalc cost and weight calculations"
          git push
