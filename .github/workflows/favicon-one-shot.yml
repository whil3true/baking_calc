name: One-shot favicon update

on:
  push:
    branches:
      - feature/favicon

permissions:
  contents: write

jobs:
  apply-favicon:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: feature/favicon
          fetch-depth: 0

      - name: Add favicon and wire canonical pages
        shell: python
        run: |
          from pathlib import Path

          favicon = '''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="KonditerCalc">
            <rect width="64" height="64" rx="16" fill="#D97736"/>
            <path d="M17 42h31L40 23 17 42Z" fill="#fff"/>
            <path d="M24 36h20" fill="none" stroke="#D97736" stroke-width="3.5" stroke-linecap="round"/>
            <circle cx="34" cy="20" r="3.2" fill="#fff"/>
          </svg>
          '''
          Path('favicon.svg').write_text(favicon, encoding='utf-8')

          pages = [
              'index.html',
              'pereschet-recepta/index.html',
              'raschet-krema-dlya-torta/index.html',
              'razmer-torta-po-gostyam/index.html',
              'pereschet-zhelatina-bloom/index.html',
              'konverter-ingredientov/index.html',
              'raschet-ceny-torta/index.html',
          ]

          marker = '<meta name="viewport" content="width=device-width, initial-scale=1.0">'
          link = '<link rel="icon" href="/favicon.svg" type="image/svg+xml">'

          for page in pages:
              path = Path(page)
              text = path.read_text(encoding='utf-8')
              if link in text:
                  continue
              if marker not in text:
                  raise SystemExit(f'Missing viewport marker in {page}')
              text = text.replace(marker, marker + '\n' + link, 1)
              path.write_text(text, encoding='utf-8')

          test = r'''const test = require('node:test');
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const root = path.join(__dirname, '..');
          const pages = [
            'index.html',
            'pereschet-recepta/index.html',
            'raschet-krema-dlya-torta/index.html',
            'razmer-torta-po-gostyam/index.html',
            'pereschet-zhelatina-bloom/index.html',
            'konverter-ingredientov/index.html',
            'raschet-ceny-torta/index.html',
          ];

          test('favicon exists and canonical pages reference it', () => {
            const faviconPath = path.join(root, 'favicon.svg');
            assert.equal(fs.existsSync(faviconPath), true, 'favicon.svg must exist at site root');
            const favicon = fs.readFileSync(faviconPath, 'utf8');
            assert.match(favicon, /<svg[^>]+viewBox="0 0 64 64"/);
            for (const page of pages) {
              const html = fs.readFileSync(path.join(root, page), 'utf8');
              assert.match(html, /<link rel="icon" href="\/favicon\.svg" type="image\/svg\+xml">/, `${page} must reference /favicon.svg`);
            }
          });
          '''
          Path('tests/favicon.test.cjs').write_text(test, encoding='utf-8')

      - name: Remove one-shot workflow
        run: rm .github/workflows/favicon-one-shot.yml

      - name: Commit generated favicon changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add favicon.svg tests/favicon.test.cjs index.html pereschet-recepta/index.html raschet-krema-dlya-torta/index.html razmer-torta-po-gostyam/index.html pereschet-zhelatina-bloom/index.html konverter-ingredientov/index.html raschet-ceny-torta/index.html .github/workflows/favicon-one-shot.yml
          git commit -m "feat: add KonditerCalc favicon"
          git push origin HEAD:feature/favicon
