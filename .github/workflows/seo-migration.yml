name: One-shot KonditerCalc SEO migration

on:
  push:
    branches: ["feature/seo-konditercalc-migration"]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/seo-konditercalc-migration
          fetch-depth: 0
      - name: Apply SEO migration
        run: python3 tools/seo_migrate.py
      - name: Remove one-shot migration files
        run: rm -f tools/seo_migrate.py .github/workflows/seo-migration.yml
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: migrate site SEO to KonditerCalc domain"
          git push origin HEAD:feature/seo-konditercalc-migration
