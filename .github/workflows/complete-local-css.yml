name: Complete local CSS coverage

on:
  push:
    branches: [refactor/remove-tailwind]

permissions:
  contents: write

jobs:
  complete-css:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/remove-tailwind
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Complete local CSS coverage
        run: node scripts/complete-local-css.cjs
      - name: Commit CSS completion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: complete local CSS coverage"
          git push origin HEAD:refactor/remove-tailwind
