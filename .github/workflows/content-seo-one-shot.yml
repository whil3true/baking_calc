name: One-shot content SEO update

on:
  push:
    branches: ["feature/content-seo-intent"]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/content-seo-intent
      - name: Apply content SEO
        shell: python
        run: |
          from pathlib import Path

          def replace_all(path, replacements):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f'{path}: missing replacement source: {old[:80]}')
                  text = text.replace(old, new)
              p.write_text(text, encoding='utf-8')

          def insert_before(path, marker, block):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if marker not in text:
                  raise SystemExit(f'{path}: marker missing')
              if block.strip() in text:
                  return
              text = text.replace(marker, block + '\n' + marker, 1)
              p.write_text(text, encoding='utf-8')

          # Search-intent titles/descriptions. Replacement updates title, OG, Twitter and JSON-LD together.
          page_meta = {
              'pereschet-recepta/index.html': (
                  'Пересчёт рецепта под другую форму онлайн | KonditerCalc',
                  'Калькулятор пересчёта рецепта под другую форму | KonditerCalc',
                  'Пересчитайте рецепт под круглую или прямоугольную форму, учтите высоту и рассчитайте себестоимость ингредиентов онлайн.',
                  'Пересчитайте рецепт под другой диаметр или размер формы. Калькулятор рассчитает коэффициент, новые количества ингредиентов и себестоимость.'
              ),
              'raschet-krema-dlya-torta/index.html': (
                  'Калькулятор крема для торта онлайн | KonditerCalc',
                  'Сколько крема нужно на торт: калькулятор | KonditerCalc',
                  'Рассчитайте количество крема для прослоек, верха и боков круглого или прямоугольного торта с учётом запаса.',
                  'Рассчитайте, сколько крема нужно на прослойки, верх и бока круглого или прямоугольного торта с учётом толщины, плотности и запаса.'
              ),
              'razmer-torta-po-gostyam/index.html': (
                  'Размер торта по количеству гостей | KonditerCalc',
                  'Калькулятор размера торта по количеству гостей | KonditerCalc',
                  'Рассчитайте размер круглого или прямоугольного торта по количеству гостей, размеру порции и запасу.',
                  'Подберите размер круглого или прямоугольного торта по количеству гостей, размеру одного кусочка и запасу порций.'
              ),
              'pereschet-zhelatina-bloom/index.html': (
                  'Пересчёт желатина по Bloom онлайн | KonditerCalc',
                  'Калькулятор желатина Bloom: пересчёт силы | KonditerCalc',
                  'Пересчитайте количество желатина между разной силой Bloom и рассчитайте воду для гидратации.',
                  'Пересчитайте количество желатина при замене одной силы Bloom на другую и рассчитайте воду для гидратации.'
              ),
              'konverter-ingredientov/index.html': (
                  'Конвертер ингредиентов: граммы, мл, кг и литры | KonditerCalc',
                  'Граммы в миллилитры: конвертер ингредиентов | KonditerCalc',
                  'Переводите граммы, килограммы, миллилитры и литры. Для перевода массы в объём используйте плотность ингредиента.',
                  'Переводите граммы в миллилитры и обратно по плотности ингредиента, а также конвертируйте граммы, килограммы, миллилитры и литры.'
              ),
              'raschet-ceny-torta/index.html': (
                  'Калькулятор цены торта и десерта | KonditerCalc',
                  'Калькулятор себестоимости и цены торта | KonditerCalc',
                  'Рассчитайте цену торта или десерта с учётом себестоимости, работы, комиссии, прибыли, маржи и наценки.',
                  'Рассчитайте себестоимость и цену торта или десерта с учётом ингредиентов, упаковки, работы, комиссии, прибыли, маржи и наценки.'
              )
          }
          for path, (old_title, new_title, old_desc, new_desc) in page_meta.items():
              replace_all(path, [(old_title, new_title), (old_desc, new_desc)])

          recipe = '''  <section class="card p-5 md:p-6 text-sm" aria-labelledby="recipe-guide-title">
            <h2 id="recipe-guide-title" class="text-xl md:text-2xl font-bold mb-3">Как пересчитать рецепт под другой диаметр или форму</h2>
            <div class="space-y-3 text-dark/70 leading-relaxed">
              <p>Калькулятор сначала сравнивает площадь исходной и новой формы, получает коэффициент и умножает на него количество каждого ингредиента. Для круглых форм коэффициент по площади равен отношению квадратов диаметров: <strong>(новый диаметр / исходный диаметр)²</strong>. Для прямоугольных форм сравниваются длина × ширина.</p>
              <p>Если важен не только размер основания, но и высота изделия, включите высоту для обеих форм. Тогда коэффициент дополнительно умножается на отношение новой и исходной высоты.</p>
              <h3 class="font-semibold text-dark">Пример: форма 20 см → 24 см</h3>
              <p>Для двух круглых форм одинаковой высоты коэффициент равен (24 / 20)² = <strong>1,44</strong>. Значит, 200 г муки превращаются в 288 г, а 100 г сахара — в 144 г.</p>
            </div>
            <div class="mt-5 space-y-3">
              <h3 class="font-semibold">Частые вопросы</h3>
              <details><summary class="font-medium cursor-pointer">Можно пересчитать круглую форму в прямоугольную?</summary><p class="mt-2 text-dark/70 leading-relaxed">Да. Калькулятор сравнивает площади разных форм, поэтому исходная и новая форма не обязаны быть одного типа.</p></details>
              <details><summary class="font-medium cursor-pointer">Когда нужно учитывать высоту?</summary><p class="mt-2 text-dark/70 leading-relaxed">Когда вы хотите сохранить близкий объём изделия и высота исходной и новой формы действительно различается. Высоту нужно включить сразу для обеих форм.</p></details>
              <details><summary class="font-medium cursor-pointer">Как считается себестоимость после пересчёта?</summary><p class="mt-2 text-dark/70 leading-relaxed">Для ингредиента используется цена упаковки, её размер и новое количество. Если хотя бы для одного используемого ингредиента не хватает цены или размера упаковки, калькулятор помечает себестоимость как неполную.</p></details>
            </div>
            <p class="mt-5 text-dark/70">После пересчёта можно отдельно <a class="home-link" href="/raschet-krema-dlya-torta/">рассчитать крем для торта</a> или передать полную себестоимость в <a class="home-link" href="/raschet-ceny-torta/">калькулятор цены торта</a>.</p>
          </section>'''
          insert_before('pereschet-recepta/index.html', '<footer class="text-center py-3">', recipe)

          cream = '''  <section class="card p-5 md:p-6 text-sm" aria-labelledby="cream-guide-title">
            <h2 id="cream-guide-title" class="text-xl md:text-2xl font-bold mb-3">Сколько крема нужно на торт</h2>
            <div class="space-y-3 text-dark/70 leading-relaxed">
              <p>Количество крема зависит не только от диаметра торта. В расчёте учитываются форма, высота, число прослоек, толщина крема между коржами, покрытие верха и боков, плотность крема и выбранный запас.</p>
              <p>Калькулятор отдельно считает объём крема для прослоек и внешнего покрытия, переводит объём в массу через плотность, затем добавляет запас. Поэтому одинаковые по размеру торты могут требовать разное количество крема.</p>
              <h3 class="font-semibold text-dark">Пример расчёта</h3>
              <p>Для круглого торта диаметром 20 см и высотой 10 см, двух прослоек по 10 мм, покрытия сверху и по бокам толщиной 5 мм, плотности 1 г/мл и запаса 10% расчёт даёт примерно <strong>1240 г крема</strong> с округлением вверх.</p>
            </div>
            <div class="mt-5 space-y-3">
              <h3 class="font-semibold">Частые вопросы</h3>
              <details><summary class="font-medium cursor-pointer">Три коржа — это три прослойки?</summary><p class="mt-2 text-dark/70 leading-relaxed">Нет. Между тремя коржами обычно две прослойки. В поле нужно указывать именно количество слоёв крема между коржами.</p></details>
              <details><summary class="font-medium cursor-pointer">Зачем указывать плотность крема?</summary><p class="mt-2 text-dark/70 leading-relaxed">Геометрия даёт объём, а для получения граммов нужен вес одного миллилитра крема. Воздушный и плотный крем одинакового объёма весят по-разному.</p></details>
              <details><summary class="font-medium cursor-pointer">Учитывается ли декор?</summary><p class="mt-2 text-dark/70 leading-relaxed">Нет. Расчёт предназначен для ровных прослоек и покрытия. Бордюры, цветы, шапочки и крупный декор лучше считать отдельно.</p></details>
            </div>
            <p class="mt-5 text-dark/70">Если размер торта ещё неизвестен, сначала используйте <a class="home-link" href="/razmer-torta-po-gostyam/">калькулятор размера по количеству гостей</a>.</p>
          </section>'''
          insert_before('raschet-krema-dlya-torta/index.html', '<details class="card p-5 md:p-6 text-sm">', cream)

          portions = '''  <section class="card p-5 md:p-6 text-sm" aria-labelledby="portion-guide-title">
            <h2 id="portion-guide-title" class="text-xl md:text-2xl font-bold mb-3">Как подобрать размер торта на нужное количество гостей</h2>
            <div class="space-y-3 text-dark/70 leading-relaxed">
              <p>Калькулятор исходит из размера одного кусочка и количества порций. Для круглого торта кусочек приближён клином-треугольником, а для прямоугольного — прямоугольником. После добавления запаса суммарная площадь порций переводится в рекомендуемый размер торта.</p>
              <p>Это геометрическая оценка по площади. Высота торта, количество ярусов и фактический способ нарезки могут изменить реальное число порций, поэтому для ответственного заказа разумно оставлять запас.</p>
              <h3 class="font-semibold text-dark">Пример: торт на 20 человек</h3>
              <p>При круглом торте, кусочке 10 × 5 см и запасе 10% калькулятор закладывает <strong>22 порции</strong>. По используемой модели минимальный диаметр получается около 26,5 см и округляется вверх до <strong>27 см</strong>.</p>
            </div>
            <div class="mt-5 space-y-3">
              <h3 class="font-semibold">Частые вопросы</h3>
              <details><summary class="font-medium cursor-pointer">Учитывает ли расчёт высоту торта?</summary><p class="mt-2 text-dark/70 leading-relaxed">Нет. Здесь расчёт идёт по площади порций. Для очень высоких или низких тортов фактический размер порции может отличаться.</p></details>
              <details><summary class="font-medium cursor-pointer">Зачем нужен запас порций?</summary><p class="mt-2 text-dark/70 leading-relaxed">Он покрывает дополнительные порции и ситуацию, когда часть кусочков нарезана крупнее расчётного размера.</p></details>
              <details><summary class="font-medium cursor-pointer">Можно рассчитать прямоугольный торт?</summary><p class="mt-2 text-dark/70 leading-relaxed">Да. Для прямоугольной формы калькулятор подбирает компактные целочисленные длину и ширину, достаточные для заданного числа порций.</p></details>
            </div>
            <p class="mt-5 text-dark/70">После выбора размера можно рассчитать <a class="home-link" href="/raschet-krema-dlya-torta/">необходимое количество крема</a> и затем <a class="home-link" href="/raschet-ceny-torta/">цену готового торта</a>.</p>
          </section>'''
          insert_before('razmer-torta-po-gostyam/index.html', '<details class="card p-5 md:p-6 text-sm">', portions)

          gelatin = '''  <section class="card p-5 md:p-6 text-sm" aria-labelledby="gelatin-guide-title">
            <h2 id="gelatin-guide-title" class="text-xl md:text-2xl font-bold mb-3">Как пересчитать желатин одной силы Bloom на другую</h2>
            <div class="space-y-3 text-dark/70 leading-relaxed">
              <p>Bloom показывает силу желатина. Если в рецепте указан желатин одной силы, а у вас есть другой, одинаковая масса не всегда даст тот же результат. Калькулятор использует приближённую формулу: <strong>новая масса = масса по рецепту × √(Bloom рецепта / Bloom вашего желатина)</strong>.</p>
              <p>После пересчёта массы отдельно рассчитывается вода для гидратации по выбранному отношению воды к желатину.</p>
              <h3 class="font-semibold text-dark">Пример: 200 Bloom → 180 Bloom</h3>
              <p>Если рецепт требует 10 г желатина 200 Bloom, при замене на 180 Bloom получается примерно <strong>10,54 г желатина</strong>. При гидратации 1:5 понадобится около <strong>52,7 г воды</strong>.</p>
            </div>
            <div class="mt-5 space-y-3">
              <h3 class="font-semibold">Частые вопросы</h3>
              <details><summary class="font-medium cursor-pointer">Если Bloom ниже, желатина нужно больше?</summary><p class="mt-2 text-dark/70 leading-relaxed">По используемой формуле да: более слабого желатина потребуется немного больше, а более сильного — меньше.</p></details>
              <details><summary class="font-medium cursor-pointer">Откуда взять отношение воды для гидратации?</summary><p class="mt-2 text-dark/70 leading-relaxed">Используйте значение из рецепта или рекомендации производителя вашего желатина. Калькулятор не подменяет технологию конкретного продукта.</p></details>
              <details><summary class="font-medium cursor-pointer">Это точная универсальная замена?</summary><p class="mt-2 text-dark/70 leading-relaxed">Нет. Формула является практическим приближением. На результат также влияют тип желатина, состав десерта, температура и технология приготовления.</p></details>
            </div>
            <p class="mt-5 text-dark/70">Для перевода граммов и миллилитров при работе с ингредиентами используйте <a class="home-link" href="/konverter-ingredientov/">конвертер ингредиентов</a>.</p>
          </section>'''
          insert_before('pereschet-zhelatina-bloom/index.html', '<details class="card p-5 md:p-6 text-sm">', gelatin)

          converter = '''  <section class="card p-5 md:p-6 text-sm" aria-labelledby="converter-guide-title">
            <h2 id="converter-guide-title" class="text-xl md:text-2xl font-bold mb-3">Как перевести граммы в миллилитры и обратно</h2>
            <div class="space-y-3 text-dark/70 leading-relaxed">
              <p>Граммы измеряют массу, а миллилитры — объём, поэтому между ними нет одного универсального коэффициента. Для перевода нужна плотность конкретного ингредиента в г/мл.</p>
              <p>Формулы простые: <strong>миллилитры = граммы / плотность</strong>, а <strong>граммы = миллилитры × плотность</strong>. Перевод внутри одной величины, например граммы ↔ килограммы или миллилитры ↔ литры, плотности не требует.</p>
              <h3 class="font-semibold text-dark">Пример: 100 г продукта плотностью 0,8 г/мл</h3>
              <p>100 / 0,8 = <strong>125 мл</strong>. Поэтому автоматически считать, что 100 г любого продукта равны 100 мл, нельзя.</p>
            </div>
            <div class="mt-5 space-y-3">
              <h3 class="font-semibold">Частые вопросы</h3>
              <details><summary class="font-medium cursor-pointer">Когда 1 грамм равен 1 миллилитру?</summary><p class="mt-2 text-dark/70 leading-relaxed">Только при плотности 1 г/мл. Для ингредиентов с другой плотностью масса и объём численно различаются.</p></details>
              <details><summary class="font-medium cursor-pointer">Нужна ли плотность для перевода кг в граммы?</summary><p class="mt-2 text-dark/70 leading-relaxed">Нет. Это обе единицы массы: 1 кг = 1000 г. Аналогично 1 л = 1000 мл для единиц объёма.</p></details>
              <details><summary class="font-medium cursor-pointer">Где взять плотность ингредиента?</summary><p class="mt-2 text-dark/70 leading-relaxed">Из надёжной технологической таблицы, документации производителя или измерить самостоятельно: массу известного объёма разделить на этот объём.</p></details>
            </div>
            <p class="mt-5 text-dark/70">Если задача связана с изменением количества всех ингредиентов рецепта, удобнее использовать <a class="home-link" href="/pereschet-recepta/">калькулятор пересчёта рецепта</a>.</p>
          </section>'''
          insert_before('konverter-ingredientov/index.html', '<details class="card p-5 md:p-6 text-sm">', converter)

          price = '''  <section class="card p-5 md:p-6 text-sm" aria-labelledby="price-guide-title">
            <h2 id="price-guide-title" class="text-xl md:text-2xl font-bold mb-3">Как посчитать себестоимость и цену торта</h2>
            <div class="space-y-3 text-dark/70 leading-relaxed">
              <p>Базовая себестоимость складывается из ингредиентов, упаковки, прочих прямых расходов и стоимости работы. В калькуляторе стоимость работы считается как количество часов × стоимость часа.</p>
              <p>После этого цена продажи рассчитывается с учётом комиссии и выбранной цели: желаемой маржи в процентах или конкретной прибыли в рублях. Маржа и наценка выводятся отдельно, потому что это разные показатели.</p>
              <h3 class="font-semibold text-dark">Пример расчёта цены</h3>
              <p>Если ингредиенты стоят 1000 ₽, упаковка 150 ₽, другие расходы 100 ₽, а работа занимает 3 часа по 500 ₽, базовая себестоимость равна <strong>2750 ₽</strong>. При комиссии 5% и целевой марже 30% расчётная цена продажи составляет примерно <strong>4231 ₽</strong>.</p>
            </div>
            <div class="mt-5 space-y-3">
              <h3 class="font-semibold">Частые вопросы</h3>
              <details><summary class="font-medium cursor-pointer">Чем маржа отличается от наценки?</summary><p class="mt-2 text-dark/70 leading-relaxed">Маржа — доля прибыли в цене продажи. Наценка — отношение прибыли к себестоимости. При одной и той же сделке их проценты обычно разные.</p></details>
              <details><summary class="font-medium cursor-pointer">Нужно ли учитывать своё рабочее время?</summary><p class="mt-2 text-dark/70 leading-relaxed">Если вы хотите видеть экономически осмысленную цену заказа, работу стоит учитывать отдельно от ингредиентов. Нулевая стоимость собственного времени искусственно занижает себестоимость.</p></details>
              <details><summary class="font-medium cursor-pointer">Можно перенести себестоимость из пересчёта рецепта?</summary><p class="mt-2 text-dark/70 leading-relaxed">Да. Если в калькуляторе рецепта заполнены все цены и размеры упаковок, готовую себестоимость можно передать сюда и затем добавить работу, комиссию и цель по прибыли.</p></details>
            </div>
            <p class="mt-5 text-dark/70">Если себестоимость ингредиентов ещё не посчитана, начните с <a class="home-link" href="/pereschet-recepta/">пересчёта рецепта и стоимости ингредиентов</a>.</p>
          </section>'''
          insert_before('raschet-ceny-torta/index.html', '<details class="card p-5 md:p-6 text-sm">', price)

          home = '''  <section class="card p-5 md:p-6 mt-8 md:mt-10" aria-labelledby="popular-tasks-title">
            <h2 id="popular-tasks-title" class="text-xl md:text-2xl font-bold mb-3">Популярные расчёты для кондитера</h2>
            <div class="space-y-3 text-sm md:text-base text-dark/70 leading-relaxed">
