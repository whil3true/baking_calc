name: Remove Tailwind codemod

on:
  push:
    branches: [refactor/remove-tailwind]

permissions:
  contents: write

jobs:
  codemod:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/remove-tailwind
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply one-shot migration
        run: node scripts/remove-tailwind.cjs
      - name: Commit migrated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: remove Tailwind dependency from public pages"
          git push origin HEAD:refactor/remove-tailwind
