name: One-shot SEO finalization

on:
  push:
    branches: ["feature/seo-konditercalc-migration"]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/seo-konditercalc-migration
          fetch-depth: 0
      - name: Apply final fixes
        run: python3 tools/seo_finalize.py
      - name: Remove one-shot files
        run: rm -f tools/seo_finalize.py .github/workflows/seo-finalize.yml
      - name: Commit finalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: finalize KonditerCalc SEO migration"
          git push origin HEAD:feature/seo-konditercalc-migration
