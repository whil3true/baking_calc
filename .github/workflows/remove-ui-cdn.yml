name: Remove UI CDN dependencies

on:
  push:
    branches: [refactor/remove-ui-cdn]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/remove-ui-cdn
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply migration
        run: node tools/remove-ui-cdn.cjs
      - name: Remove one-shot migration files
        run: rm tools/remove-ui-cdn.cjs .github/workflows/remove-ui-cdn.yml
      - name: Commit migrated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "refactor: remove external font and icon CDNs"
          git push origin HEAD:refactor/remove-ui-cdn
